version: '3.9'

services:
  selenoid:
    image: aerokube/selenoid:latest-release
    volumes:
      - "./config:/etc/selenoid"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "4444:4444"
    command: ["-conf", "/etc/selenoid/browsers.json", "-limit", "4", "-video-output-dir", "/opt/selenoid/video", "-container-network", "sdet_practicum_ui_default"]

  tests:
    build: .
    environment:
      - BASE_URL=https://www.globalsqa.com
      - REMOTE_URL=http://selenoid:4444/wd/hub
    depends_on:
      - selenoid
    command: pytest --alluredir=allure-results
    volumes:
      - ./allure-results:/app/allure-results
